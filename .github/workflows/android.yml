# Test and build the Android app. Run by build.yml when a change touches android/, and by
# android-cut.yml before it releases.
name: android

on:
  workflow_call:
    inputs:
      ref:
        description: commit to test; the caller's own when empty
        type: string
        default: ""
    outputs:
      sha:
        description: the commit tested
        value: ${{ jobs.android.outputs.sha }}

permissions:
  contents: read

jobs:
  android:
    outputs:
      sha: ${{ steps.checkout.outputs.commit }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21" # the daemon JVM, gradle/gradle-daemon-jvm.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug detekt
