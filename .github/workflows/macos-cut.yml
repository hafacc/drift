# Cut a release of the macOS app: test main's tip, bump the version on top of exactly that
# commit and push the bump and its tag to main together. Xcode Cloud builds from the tag.
# Started by hand, or by cut.yml.
name: macos-cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
  workflow_call:
    inputs:
      bump:
        description: semver bump (patch, minor or major)
        type: string
        default: patch

# one cut at a time across every cut workflow, held from the test until the push
concurrency:
  group: cut
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/apple.yml
    with:
      ref: main # its tip now, so a cut that waited its turn tests the cuts before it
    permissions:
      contents: read

  cut:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump and tag
      checks: read # see that Xcode Cloud started
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }} # a main that moved since is refused by the push
      - name: bump, commit and tag
        id: bump
        env:
          bump: ${{ inputs.bump }}
        run: |
          # apple/Config/Versions.xcconfig is the version source of truth, for the app and its widget
          config=apple/Config/Versions.xcconfig
          key="MARKETING_VERSION[sdk=macosx*]"
          IFS=. read -r major minor patch <<< "$(grep -F "$key = " "$config" | sed 's/.* = //')"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "s/^MARKETING_VERSION\\[sdk=macosx\\*\\] = .*/$key = $version/" "$config"
          grep -Fx "$key = $version" "$config"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "macos v$version"
          git tag -a "macos-v$version" -m "macos v$version"
          echo "tag=macos-v$version" >> "$GITHUB_OUTPUT"
      - name: push
        env:
          tag: ${{ steps.bump.outputs.tag }}
        # all or nothing: a refused main or tag leaves neither pushed. Xcode Cloud watches the
        # repository itself, so a token-pushed tag still starts its build
        run: git push --atomic origin HEAD:main "refs/tags/$tag"
      - name: check that Xcode Cloud started
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.bump.outputs.tag }}
        # Xcode Cloud puts a check on a tag's commit when it starts on it; a tag it never saw gets
        # none. Waiting here also keeps the next cut's tag minutes after this one: of two tags
        # pushed in the same second, Xcode Cloud builds only the last
        run: |
          for _ in $(seq 20); do
            started=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag/check-runs" \
              --jq '[.check_runs[] | select(.app.name == "Xcode Cloud")] | length')
            if [ "$started" -gt 0 ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::Xcode Cloud did not start on $tag. Start that build by hand in App Store Connect, from the tag."
          exit 1
