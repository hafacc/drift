# Publish a tagged Android release in two jobs: `bundle` builds the signed bundle, keeps it as
# the run's artifact and creates the GitHub release; `play` uploads that same bundle to Play's
# internal testing track, rolled out to testers. Started by android-cut.yml. If Play refuses,
# re-run the failed job: it uploads the bundle already built. An app's first publish fails at
# Play, which wants that bundle uploaded by hand: take it from the artifact. Promote it in the
# Play Console.
name: android-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. android-v0.1.1)
        required: true
        type: string

permissions: {}

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21" # the daemon JVM, gradle/gradle-daemon-jvm.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - name: restore signing key
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: base64 --decode <<< "$ANDROID_KEYSTORE" > "$RUNNER_TEMP/upload.jks"
      - name: build the bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:bundleRelease
          "-Pdrift.storeFile=$RUNNER_TEMP/upload.jks"
          "-Pdrift.storePassword=$STORE_PASSWORD"
          "-Pdrift.keyAlias=$KEY_ALIAS"
          "-Pdrift.keyPassword=$KEY_PASSWORD"
      - uses: actions/upload-artifact@v7
        with:
          name: drift-${{ inputs.tag }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ inputs.tag }}
        run: |
          # notes cover only what changed since the last Android release
          if gh release view "$tag" > /dev/null 2>&1; then
            exit 0
          fi
          if previous=$(git describe --tags --abbrev=0 --match "android-v*" "$tag^" 2>/dev/null); then
            gh release create "$tag" --generate-notes --verify-tag --notes-start-tag "$previous"
          else
            gh release create "$tag" --generate-notes --verify-tag
          fi

  play:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21" # the daemon JVM, gradle/gradle-daemon-jvm.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: actions/download-artifact@v8
        with:
          name: drift-${{ inputs.tag }}
          path: ${{ runner.temp }}/bundle
      - name: upload to Play
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # Play refuses a rolled-out release while the app has never passed review; a draft is rolled out by hand.
        run: |
          publish() {
            ./gradlew :app:publishReleaseBundle --release-status "$1" \
              --artifact-dir "$RUNNER_TEMP/bundle"
          }
          if ! publish completed; then
            echo "::warning::Play refused a rolled-out release; uploading a draft to roll out by hand."
            publish draft
          fi
