# Cut a release of every chosen app in one go, each with the same bump, and publish main's
# site. Each app runs its own *-cut.yml, which takes the `cut` lock itself, so they push one
# after another. The site checks itself.
name: cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      android:
        description: Android app
        type: boolean
        default: true
      macos:
        description: macOS app
        type: boolean
        default: true
      ios:
        description: iOS app
        type: boolean
        default: true
      web:
        description: deploy the site
        type: boolean
        default: true

permissions: {}

jobs:
  android:
    if: inputs.android
    uses: ./.github/workflows/android-cut.yml
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write # push the bump and tag
      actions: write # start the publish

  macos:
    if: inputs.macos
    uses: ./.github/workflows/macos-cut.yml
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write # push the bump and tag
      checks: read # see that Xcode Cloud started

  ios:
    if: inputs.ios
    uses: ./.github/workflows/ios-cut.yml
    with:
      bump: ${{ inputs.bump }}
    permissions:
      contents: write # push the bump and tag
      checks: read # see that Xcode Cloud started

  web:
    if: inputs.web
    uses: ./.github/workflows/web-deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
