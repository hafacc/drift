name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # which of the jobs below run: those whose folder or workflow the change touches, and all of
  # them when it touches this file
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read # a push is compared with git
      pull-requests: read # a pull request's files are listed through the API
    outputs:
      site: ${{ steps.touched.outputs.site == 'true' || steps.touched.outputs.all == 'true' }}
      android: ${{ steps.touched.outputs.android == 'true' || steps.touched.outputs.all == 'true' }}
      apple: ${{ steps.touched.outputs.apple == 'true' || steps.touched.outputs.all == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: touched
        with:
          filters: |
            all:
              - .github/workflows/build.yml
            site:
              - site/**
              - .github/workflows/site.yml
            android:
              - android/**
              - .github/workflows/android.yml
            apple:
              - apple/**
              - .github/workflows/apple.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/site.yml

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android.yml

  apple:
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    uses: ./.github/workflows/apple.yml
