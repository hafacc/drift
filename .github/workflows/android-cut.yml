# Cut a release of the Android app: test main's tip, bump the version on top of exactly that
# commit, push the bump and its tag to main together, then start android-publish.yml on the tag.
# Started by hand, or by cut.yml.
name: android-cut

on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
  workflow_call:
    inputs:
      bump:
        description: semver bump (patch, minor or major)
        type: string
        default: patch

# one cut at a time across every cut workflow, held from the test until the push
concurrency:
  group: cut
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/android.yml
    with:
      ref: main # its tip now, so a cut that waited its turn tests the cuts before it
    permissions:
      contents: read

  cut:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump and tag
      actions: write # start the publish
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.test.outputs.sha }} # a main that moved since is refused by the push
      - name: bump, commit and tag
        id: bump
        env:
          bump: ${{ inputs.bump }}
        # android/app/build.gradle.kts is the version source of truth
        run: |
          gradle=android/app/build.gradle.kts
          current=$(sed -nE 's/^ *versionName = "([^"]+)"/\1/p' "$gradle")
          code=$(sed -nE 's/^ *versionCode = ([0-9]+)/\1/p' "$gradle")
          IFS=. read -r major minor patch <<< "$current"
          case "$bump" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            *) version="$major.$minor.$((patch + 1))" ;;
          esac
          # Play rejects a versionCode it has already seen, so it only ever goes up
          sed -i -E \
            -e "s/^( *versionName = )\"[^\"]+\"/\1\"$version\"/" \
            -e "s/^( *versionCode = )[0-9]+/\1$((code + 1))/" \
            "$gradle"
          grep -F "versionName = \"$version\"" "$gradle"
          grep -F "versionCode = $((code + 1))" "$gradle"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "android v$version"
          git tag -a "android-v$version" -m "android v$version"
          echo "tag=android-v$version" >> "$GITHUB_OUTPUT"
      - name: push and start the publish
        env:
          GH_TOKEN: ${{ github.token }}
          tag: ${{ steps.bump.outputs.tag }}
        run: |
          # all or nothing: a refused main or tag leaves neither pushed
          git push --atomic origin HEAD:main "refs/tags/$tag"
          # a tag pushed with this token doesn't fire on:push, so start the publish directly
          gh workflow run android-publish.yml --ref main -f tag="$tag"
