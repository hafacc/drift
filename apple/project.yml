# Xcode project spec (generated with: xcodegen generate).
#
# Drift is one app target that builds for both macOS and iOS, and embeds the
# DriftWidget extension, which also builds for both. App/ and Widget/ are compiled only
# for macOS, iOSApp/ and iOSWidget/ only for iOS. Everything depends on the MideaKit
# Swift package (github.com/hafacc/MideaKit) and shares the set-up device through a
# Keychain access group (cc.hafa.Drift.shared). The team is baked in below; if you need
# to change it, edit DEVELOPMENT_TEAM or set it in Xcode.
#
# Each platform has its own Info.plist and entitlements file, picked by SDK in the
# settings below; edit those files directly. The App Group differs between platforms:
# macOS takes the Team-ID-prefixed form (an iOS-style group.* needs a provisioning
# profile and fails under local signing), iOS takes only the group.* form. Both hold the
# snapshot. com.apple.developer.networking.multicast goes in the iOS entitlements once
# Apple grants it.

name: Drift

options:
  bundleIdPrefix: cc.hafa
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

# Config/Versions.xcconfig holds MARKETING_VERSION, the version source of truth the cut
# workflows bump; it must stay out of the settings below, which would override it.
configFiles:
  Debug: Config/Versions.xcconfig
  Release: Config/Versions.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N5L2AL4B83

packages:
  MideaKit:
    url: https://github.com/hafacc/MideaKit
    from: 0.5.1

targets:
  Drift:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
        destinationFilters: [macOS]
      - path: iOSApp
        destinationFilters: [iOS]
        excludes:
          - Info.plist
      # Listed apart so it isn't copied in as a resource; xcodegen only skips the plist
      # it finds in an unconditional INFOPLIST_FILE.
      - path: iOSApp/Info.plist
        buildPhase: none
      - path: AppCore
      - path: Shared
    dependencies:
      - package: MideaKit
        product: MideaKit
      - target: DriftWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hafa.Drift
        PRODUCT_NAME: Drift
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE[sdk=macosx*]: App/Info.plist
        INFOPLIST_FILE[sdk=iphone*]: iOSApp/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Drift.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: iOSApp/Drift.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        COMBINE_HIDPI_IMAGES[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: ["@executable_path/../Frameworks"]
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DriftWidget:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widget
        destinationFilters: [macOS]
      - path: iOSWidget
        destinationFilters: [iOS]
        excludes:
          - Info.plist
      - path: iOSWidget/Info.plist
        buildPhase: none
      - path: WidgetCore
      - path: Shared
    dependencies:
      - package: MideaKit
        product: MideaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hafa.Drift.Widget
        PRODUCT_NAME: DriftWidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE[sdk=macosx*]: Widget/Info.plist
        INFOPLIST_FILE[sdk=iphone*]: iOSWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Widget/DriftWidget.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: iOSWidget/DriftWidget.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        COMBINE_HIDPI_IMAGES[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]:
          ["@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        TARGETED_DEVICE_FAMILY: "1"

  # Unit tests for first-run setup. Not hosted in the app, so they never launch it or
  # see the installed app's Keychain device; they compile the setup sources directly.
  DriftTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
      - path: AppCore
      - path: Shared
        excludes:
          - PrivacyInfo.xcprivacy
    dependencies:
      - package: MideaKit
        product: MideaKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.hafa.DriftTests
        GENERATE_INFOPLIST_FILE: YES
        COMBINE_HIDPI_IMAGES[sdk=macosx*]: YES
        CODE_SIGN_IDENTITY[sdk=macosx*]: Apple Development
        LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]: ["@executable_path/../Frameworks", "@loader_path/../Frameworks"]
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Drift:
    build:
      targets:
        Drift: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DriftTests
    archive:
      config: Release
